name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches M.version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^M\.version = "\(.*\)"$/\1/p' lua/sprout/init.lua)
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag doesn't match M.version $version in lua/sprout/init.lua"
            exit 1
          fi

      - name: Check Lua syntax
        run: |
          sudo apt-get install -y -qq luajit > /dev/null
          for f in lua/sprout/*.lua plugin/*.lua; do
            luajit -e "assert(loadfile('$f'))"
          done

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[.*\]: / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::no CHANGELOG.md section for $version"
            exit 1
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
